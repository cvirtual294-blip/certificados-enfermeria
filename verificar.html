<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verificación de certificado</title>
<style>
body{font-family:Arial,sans-serif;background:#eef5f8;margin:0;padding:28px;color:#17324d}
.card{max-width:680px;margin:35px auto;background:#fff;border-radius:18px;padding:32px;box-shadow:0 6px 28px rgba(0,0,0,.12)}
.ok{color:#137a43;font-size:23px;font-weight:700}
h1{margin:8px 0 25px}
.label{font-weight:700;color:#547086}
.value{margin:5px 0 17px}
.code{font-family:monospace;background:#f0f4f6;padding:7px 10px;border-radius:7px;display:inline-block}
.error{color:#a22;font-weight:700}
.small{font-size:13px;color:#6b7d88;margin-top:25px}
</style>
</head>
<body>
<div class="card" id="app">
  <div class="ok">✓ Certificado válido</div>
  <h1>Verificación de certificado</h1>
  <div id="content">Verificando...</div>
</div>
<script src="datos.js"></script>
<script>
const params = new URLSearchParams(location.search);
const codigo = params.get("codigo");
const cert = CERTIFICADOS.find(x => x.codigo === codigo);
const el = document.getElementById("content");
if (!cert) {
  el.innerHTML = '<p class="error">No se encontró un certificado con ese código.</p>';
} else {
  el.innerHTML = `
    <p class="label">Participante</p><p class="value">${cert.nombre}</p>
    <p class="label">Código de verificación</p><p class="value"><span class="code">${cert.codigo}</span></p>
    <p class="label">Curso</p><p class="value">${cert.curso}</p>
    <p class="label">Fecha</p><p class="value">${cert.fecha}</p>
    <p class="label">Carga horaria</p><p class="value">${cert.horas}</p>
    <p class="label">Organiza</p><p class="value">${cert.organiza}</p>
    <p class="small">La información mostrada corresponde al registro oficial de certificados de esta edición.</p>`;
}
</script>
</body>
</html>
